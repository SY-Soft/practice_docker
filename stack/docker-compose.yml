services:

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ../projects:/var/www/projects
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../projects:/var/www/projects
      - laravel_cache:/var/cache/laravel


  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ../mysql:/var/lib/mysql
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
    ports:
      - "8080:80"

volumes:
  laravel_cache: